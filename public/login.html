<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0e1f" />
  <title>登录 · Manager Show</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='28' font-weight='800' fill='white' text-anchor='middle'%3EMS%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- 氛围背景三层（同 index.html：CSS 渐变降级层 / WebGL 星云 / 可读性暗角层，唯一色板 default 靛紫） -->
  <div class="bg-fallback" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="aurora aurora-a"></div>
  </div>
  <canvas id="nebula-canvas" class="bg-nebula" aria-hidden="true"></canvas>
  <div class="bg-veil" aria-hidden="true"></div>

  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand">
        <div class="brand-mark">MS</div>
        <div>
          <div class="brand-name">Manager Show</div>
          <div class="brand-sub">个人运营驾驶舱</div>
        </div>
      </div>
      <h1 class="login-title">欢迎回来</h1>
      <p class="login-sub">私有工作区 · 请输入管理员密码</p>
      <form id="login-form">
        <label class="field-label" for="password">管理员密码</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" class="login-input"
                 placeholder="输入密码解锁驾驶舱" autocomplete="current-password" required autofocus />
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="显示或隐藏密码">显示</button>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">登 录</button>
        <div class="login-error" id="login-error" hidden></div>
      </form>
      <div class="login-foot">数据保存在本地 SQLite · 仅你可见</div>
    </div>
  </div>
  <script src="/theme.js"></script>
  <script src="/vendor/nebula.min.js"></script>
  <script src="/login.js"></script>
</body>
</html>
