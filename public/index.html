<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0e1f" />
  <title>Manager Show · 个人管理驾驶舱</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='28' font-weight='800' fill='white' text-anchor='middle'%3EMS%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- 氛围背景三层（均 aria-hidden，纯装饰；唯一色板 default 靛紫）：
       1) .bg-fallback：CSS 渐变 + 极光（WebGL 不可用时的降级背景，body.no-webgl 时唯一可见）
       2) #nebula-canvas：WebGL 动态星云（固定全屏，body 直接子元素，不参与任何位移 → 无黑边/截断）
       3) .bg-veil：边缘暗角 + 内容可读性叠加层 -->
  <div class="bg-fallback" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="aurora aurora-a"></div>
  </div>
  <canvas id="nebula-canvas" class="bg-nebula" aria-hidden="true"></canvas>
  <div class="bg-veil" aria-hidden="true"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">MS</div>
        <div>
          <div class="brand-name">Manager Show</div>
          <div class="brand-sub">个人运营驾驶舱</div>
        </div>
      </div>
      <nav class="nav" aria-label="主导航">
        <a href="#/today" data-route="today"><span class="nav-icon">◉</span><span class="nav-label">今日首页</span></a>
        <a href="#/campus" data-route="campus"><span class="nav-icon">▦</span><span class="nav-label">校招投递</span></a>
        <a href="#/tasks" data-route="tasks"><span class="nav-icon">✓</span><span class="nav-label">任务日程</span></a>
        <a href="#/achievements" data-route="achievements"><span class="nav-icon">★</span><span class="nav-label">成果记录</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-block" id="btn-reset-seed">↺ 重置示例数据</button>
        <button class="btn btn-ghost btn-block" id="btn-logout">⏻ 退出登录</button>
        <div class="foot-note">数据保存在本地 SQLite</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost icon-btn" id="btn-menu" aria-label="菜单">☰</button>
        <h1 class="topbar-title" id="topbar-title">今日首页</h1>
        <div class="topbar-date" id="topbar-date"></div>
      </header>
      <main class="view" id="view">
        <div class="loading"><span class="spinner" aria-hidden="true"></span>加载中…</div>
      </main>
    </div>
  </div>

  <div class="modal-mask" id="modal-mask" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <div class="modal-title" id="modal-title"></div>
        <button class="btn btn-ghost icon-btn" id="modal-close" aria-label="关闭">✕</button>
      </div>
      <form id="modal-form" class="modal-body"></form>
    </div>
  </div>

  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

  <!-- 移动端底部导航（≤760px 显示，与侧边栏同一路由表） -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="移动端主导航">
    <a href="#/today" data-route="today"><span class="bn-ico" aria-hidden="true">◉</span><span>今日</span></a>
    <a href="#/campus" data-route="campus"><span class="bn-ico" aria-hidden="true">▦</span><span>投递</span></a>
    <a href="#/tasks" data-route="tasks"><span class="bn-ico" aria-hidden="true">✓</span><span>任务</span></a>
    <a href="#/achievements" data-route="achievements"><span class="bn-ico" aria-hidden="true">★</span><span>成果</span></a>
  </nav>

  <script src="/theme.js"></script>
  <script src="/vendor/nebula.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
